<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="header-footer.css">
    <title>Contatos</title>
</head>
<body class="bg-white">

    <header class="md:h-[110px] flex flex-col md:flex-row justify-between items-center px-4 md:px-10">
        <img src="Imagens/V-transp.png" alt="Logo" class="w-[180px] md:w-[225px] md:-ml-[30px] object-contain">

        <nav class="md:mr-10 font-bold text-[14px] sm:text-[16px] md:text-[18px] text-black whitespace-nowrap pb-4 md:pb-0">
            <a href="index.html">Homepage</a>
            <span class="mx-1 md:mx-2">|</span>
            <a href="quem.html">Quem somos</a>
            <span class="mx-1 md:mx-2">|</span>
            <a href="contatos.html">Contato</a>
        </nav>
    </header>

    <main class="bg-[#2b2a4c] min-h-[500px] flex flex-col lg:flex-row justify-center items-center gap-10 lg:gap-[100px] text-white p-10">
        
        <div class="form-container">
            <h2 id="entre-em-contato" class="text-center text-2xl font-bold mb-4">Entre em contato conosco!</h2>
            <form action="" method="POST" class="bg-[#121222] p-[10px] rounded-[5px] space-y-4">
                <p>
                    <label for="id-email">E-mail</label><br>
                    <input type="text" name="email" id="id-email" required class="w-[300px] h-[30px] rounded-[3px] text-black px-2">
                </p>
                
                <p>
                    <label for="id-assunto">Assunto</label><br>
                    <input type="text" name="assunto" id="id-assunto" required class="w-[300px] h-[30px] rounded-[3px] text-black px-2">
                </p>

                <p>
                    <label for="id-descricao">Descrição</label><br>
                    <textarea name="descricao" id="id-descricao" class="h-[80px] w-[300px] rounded-[3px] text-black px-2 py-1"></textarea>
                </p>
                
                <p class="flex gap-2">
                    <input type="submit" value="ENVIAR" class="w-[150px] text-[15px] rounded-[3px] font-bold bg-white text-black cursor-pointer hover:bg-[#121222] hover:border hover:border-white hover:text-white transition-all">
                    <input type="reset" value="LIMPAR" class="w-[150px] text-[15px] rounded-[3px] font-bold bg-white text-black cursor-pointer hover:bg-[#121222] hover:border hover:border-white hover:text-white transition-all">
                </p>
            </form>
        </div>

        <section class="redes-sociais flex flex-col mb-[70px]">
            <h2 class="text-2xl font-bold -mt-[1px] mb-4 text-center lg:text-left">Nossas redes sociais</h2>

            <div class="redes-icons flex gap-5">
                <img src="Imagens/instagram.png" alt="" width="40px"> 
                <img src="Imagens/facebook.png" alt="" width="40px">
                <img src="Imagens/linkedin.png" alt="" width="40px">
                <img src="Imagens/whatsapp.png" alt="" width="40px">
            </div>
            
            <img src="Imagens/V-logo.png" alt="" width="345px" class="-ml-[68px] mt-[30px]">
        </section>
        
    </main>

    <footer class="min-h-[50px] flex flex-col items-center p-[5px] text-black">
       <div class="mt-[10px] -mb-[15px] space-x-1 flex">
            <img src="Imagens/instagram.png" alt="" width="20px">
            <img src="Imagens/facebook.png" alt="" width="20px">
            <img src="Imagens/linkedin.png" alt="" width="20px">
            <img src="Imagens/whatsapp.png" alt="" width="20px">
       </div>
       <div class="mt-5">
            <h4 class="font-bold">Todos os direitos preservados @2026</h4> 
       </div>
    </footer>
</body>
</html>
